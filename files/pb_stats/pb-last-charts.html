option></select></label></div><section class="grid"><article class="panel"><h2>Total Occurrences</h2><p>Numbers in the order of the first value table</p><div class="plot"><canvas id="totals"></canvas><div class="tooltip"></div></div></article><article class="panel"><h2>Draws Since Last Occurrence</h2><p>Numbers in the order of the second value table</p><div class="plot"><canvas id="since"></canvas><div class="tooltip"></div></div></article></section></main><script>const totals=[{n:70,total:0,since:0},{n:71,total:0,since:0},{n:72,total:0,since:0},{n:73,total:0,since:0},{n:74,total:0,since:0},{n:75,total:0,since:0},{n:13,total:114,since:22},{n:35,total:116,since:2},{n:46,total:119,since:7},{n:34,total:120,since:28},{n:49,total:121,since:24},{n:26,total:124,since:0},{n:65,total:125,since:7},{n:51,total:126,since:33},{n:15,total:129,since:42},{n:60,total:130,since:3},{n:4,total:133,since:1},{n:48,total:133,since:4},{n:1,total:134,since:33},{n:29,total:136,since:12},{n:55,total:136,since:1},{n:58,total:137,since:7},{n:43,total:138,since:15},{n:22,total:139,since:9},{n:2,total:140,since:11},{n:38,total:140,since:12},{n:5,total:141,since:3},{n:8,total:141,since:5},{n:14,total:142,since:4},{n:30,total:142,since:4},{n:31,total:142,since:27},{n:11,total:144,since:57},{n:10,total:145,since:14},{n:18,total:145,since:12},{n:24,total:145,since:8},{n:7,total:146,since:12},{n:25,total:146,since:13},{n:42,total:146,since:6},{n:68,total:146,since:18},{n:9,total:147,since:2},{n:45,total:147,since:14},{n:40,total:149,since:6},{n:6,total:150,since:2},{n:39,total:150,since:18},{n:67,total:150,since:0},{n:41,total:151,since:4},{n:66,total:151,since:0},{n:54,total:152,since:1},{n:17,total:153,since:5},{n:50,total:153,since:5},{n:56,total:154,since:11},{n:12,total:155,since:16},{n:44,total:155,since:10},{n:57,total:155,since:6},{n:19,total:156,since:22},{n:20,total:156,since:3},{n:47,total:158,since:8},{n:37,total:159,since:1},{n:52,total:160,since:32},{n:59,total:163,since:3},{n:16,total:1 ='#26345c';x.fillText('No. '+b.d.n,10,b.y+4);x.font='12px system-ui';x.fillStyle=c.color;x.fillText(b.d[c.key],Math.min(b.x+7,w-p.r+28),b.y+4);});}function hover(c,e){if(!c.bars.length)return;const r=c.canvas.getBoundingClientRect(),my=e.clientY-r.top;let best=c.bars[0];for(const b of c.bars)if(Math.abs(b.y-my)<Math.abs(best.y-my))best=b;c.tip.style.display='block';c.tip.style.left=Math.min(best.x,r.width-190)+'px';c.tip.style.top=best.y+'px';c.tip.innerHTML='<strong>Number '+best.d.n+'</strong><br>Total occurrences: '+best.d.total+'<br>Draws since: '+best.d.since;}create('totals',totals,'total','#3867dd');create('since',since,'since','#ed7b32');function drawAll(){charts.forEach(draw);}document.querySelector('#style').addEventListener('change',drawAll);addEventListener('resize',drawAll);drawAll();</script></body></html>
