spring.application.name=lottery-workbench
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:${LOTTERY_DB:./data/lottery};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${LOTTERY_DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
server.error.include-message=never
lottery.seed=${LOTTERY_SEED:true}
lottery.root=${LOTTERY_ROOT:.}
server.servlet.session.cookie.same-site=strict
